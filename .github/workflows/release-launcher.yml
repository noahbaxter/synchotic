name: Release Launcher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., launcher-v1)'
        required: true
        default: 'launcher-v1'
      notes:
        description: 'Release notes. Say which platforms actually changed.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact: Synchotic-launcher-macos.zip
          - os: windows-latest
            name: windows
            artifact: synchotic-launcher.exe
          # 22.04, not latest: oldest glibc we can build against.
          - os: ubuntu-22.04
            name: linux
            artifact: Synchotic-launcher-x86_64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apple signing
        if: matrix.name == 'macos'
        id: signing
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_APPLICATION }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-password: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller certifi

      # A bundle, not a bare binary. launcher.py's host_paths() looks for
      # wezterm-gui beside sys.executable and wezterm.lua in ../Resources,
      # which only exist inside a .app, and there is no ensure_wezterm_macos()
      # to download one at runtime the way Windows and Linux do. The loose
      # binary this used to ship could therefore never open its own window.
      - name: Build launcher app (macOS)
        run: PYTHON=python packaging/macos/build_launcher_app.sh
        if: matrix.name == 'macos'

      - name: Notarize launcher app (macOS)
        if: matrix.name == 'macos' && steps.signing.outputs.available == 'true'
        run: |
          # ditto, not zip: a .app is full of symlinks that zip flattens, and
          # notarytool rejects what comes out the other side.
          ditto -c -k --keepParent dist/Synchotic.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple dist/Synchotic.app
          xcrun stapler validate dist/Synchotic.app

      - name: Zip launcher app (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent dist/Synchotic.app dist/Synchotic-launcher-macos.zip

      - name: Build launcher (Windows)
        if: matrix.name == 'windows'
        run: |
          $CERTIFI_PATH = python -c "import certifi; print(certifi.where())"
          pyinstaller --onefile --name synchotic-launcher --clean --noconfirm `
            --add-data "$CERTIFI_PATH;certifi" `
            --add-data "packaging/macos/wezterm.lua;." `
            --hidden-import certifi `
            launcher.py
        shell: pwsh

      # An AppImage, not a bare ELF. GNOME Files will not execute a plain
      # binary on double-click at all, and a downloaded one carries no icon and
      # no name, so the format the desktop actually understands is the only
      # Linux build worth shipping.
      - name: Build launcher AppImage (Linux)
        if: matrix.name == 'linux'
        run: PYTHON=python packaging/linux/build_launcher_appimage.sh

      # Packing an AppImage that cannot start is easy and invisible until
      # someone downloads it, so unpack the real artifact and boot the launcher
      # inside it. --offline stops before any network call and exits 1, which
      # is enough to prove the frozen Python loaded and read the folder AppRun
      # handed it.
      - name: Smoke test the AppImage (Linux)
        if: matrix.name == 'linux'
        run: |
          cd dist
          APPIMAGE_EXTRACT_AND_RUN=1 ./Synchotic-launcher-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/synchotic-launcher

          # Booted the way the runtime boots it: $APPIMAGE names the file the
          # user kept, which is what marks this as a bundle. Nothing may be
          # written next to that file. --hosted as well as --offline because a
          # runner has no tty, and without the recursion guard the launcher
          # decides it was double-clicked and goes off to open a window on a
          # machine with no display.
          mkdir -p "$RUNNER_TEMP/kept" "$RUNNER_TEMP/xdg"
          touch "$RUNNER_TEMP/kept/Synchotic-launcher-x86_64.AppImage"
          out=$(APPIMAGE="$RUNNER_TEMP/kept/Synchotic-launcher-x86_64.AppImage" \
            XDG_DATA_HOME="$RUNNER_TEMP/xdg" \
            ./squashfs-root/usr/bin/synchotic-launcher --hosted --offline 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "Synchotic Launcher v"
          test -d "$RUNNER_TEMP/xdg/synchotic" \
            || { echo "did not use the XDG data dir"; exit 1; }
          test ! -e "$RUNNER_TEMP/kept/.dm-sync" \
            || { echo "wrote beside the AppImage"; exit 1; }
          rm -rf squashfs-root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Clean up keychain
        if: matrix.name == 'macos' && always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Through the env, not inline: the notes are multi-line and full of
          # markdown, and pasting them into the script body would end the
          # quoting at the first character the shell cares about.
          TAG: ${{ github.event.inputs.tag }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          NOTES="${NOTES_INPUT:-Downloads and auto-updates the Synchotic app.}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" \
              artifacts/synchotic-launcher.exe/synchotic-launcher.exe \
              "artifacts/Synchotic-launcher-macos.zip/Synchotic-launcher-macos.zip" \
              "artifacts/Synchotic-launcher-x86_64.AppImage/Synchotic-launcher-x86_64.AppImage" \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --title "Synchotic Launcher $TAG" \
              --notes "$NOTES" \
              --latest=false \
              artifacts/synchotic-launcher.exe/synchotic-launcher.exe \
              "artifacts/Synchotic-launcher-macos.zip/Synchotic-launcher-macos.zip" \
              "artifacts/Synchotic-launcher-x86_64.AppImage/Synchotic-launcher-x86_64.AppImage"
          fi

      - name: Summary
        run: |
          echo "### Launcher Release ${{ github.event.inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: synchotic-launcher.exe" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: Synchotic-launcher-macos.zip (Synchotic.app)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: Synchotic-launcher-x86_64.AppImage" >> $GITHUB_STEP_SUMMARY
