name: Tests

# Called by both CI and Release. Release used to build straight from a VERSION
# push with nothing checking the tests first, so a red CI did not stop a publish
# and v1.5.1 went out over a failing Windows run.

on:
  workflow_call:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup UnRAR library
        uses: ./.github/actions/setup-unrar

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v -m "not stress"
