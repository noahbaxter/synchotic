name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Publishing is gated on the same tests CI runs. Without this the two
  # workflows raced off one push and a release could go out over a red CI,
  # which is exactly how v1.5.1 published from a commit whose tests failed.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    uses: ./.github/workflows/build-app.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=v$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # These three zips are not downloads, they are the launcher's update
          # channel: launcher.py reads {repo}/releases/latest and pulls the one
          # for its platform. That is why this release has to stay the latest
          # non-prerelease, and why nothing else is attached to it. Anyone
          # unpacking a zip by hand gets a build that never updates itself, so
          # the notes send them to the launcher instead.
          NOTES="Update payload for the Synchotic launcher. Nothing here is meant to be downloaded by hand.

          **[Get Synchotic here](https://github.com/${{ github.repository }}/releases/tag/launcher-v1.2)** and the launcher keeps itself on $VERSION."

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Updating existing release $VERSION..."
            gh release upload "$VERSION" \
              artifacts/app-macos.zip/app-macos.zip \
              artifacts/app-windows.zip/app-windows.zip \
              artifacts/app-linux.zip/app-linux.zip \
              --clobber
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" \
              --title "Synchotic $VERSION (launcher payload)" \
              --notes "$NOTES" \
              artifacts/app-macos.zip/app-macos.zip \
              artifacts/app-windows.zip/app-windows.zip \
              artifacts/app-linux.zip/app-linux.zip
          fi

      - name: Summary
        run: |
          echo "### Release ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Launcher payloads: app-macos.zip, app-windows.zip, app-linux.zip" >> $GITHUB_STEP_SUMMARY
